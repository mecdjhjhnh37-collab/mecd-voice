<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="home">


<div class="profile">


<div class="avatar">
👤
</div>


<h1 id="title"></h1>


<p id="status"></p>


</div>



<div class="menu">


<button id="createRoom"></button>


<button id="joinRoom"></button>


<button id="publicRoom"></button>


<button id="settings"></button>


</div>


</div>



<script src="language.js"></script>


<script>


let language = localStorage.getItem("language") || "ar";


let text = translations[language];



document.getElementById("title").textContent =
text.title;


document.getElementById("status").textContent =
text.online;


document.getElementById("createRoom").textContent =
text.create;


document.getElementById("joinRoom").textContent =
text.join;


document.getElementById("publicRoom").textContent =
text.rooms;


document.getElementById("settings").textContent =
text.settings;



document.getElementById("publicRoom").onclick = function(){

window.location.href = "rooms.html";

};


</script>


</body>

</html>
