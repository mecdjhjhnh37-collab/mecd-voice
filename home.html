<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="home">


<div class="profile">


<img id="userPhoto" class="avatar" src="default.png">


<h1 id="title"></h1>


<p id="userId">ID: --------</p>


<p id="status"></p>


</div>



<div class="menu">


<button id="createRoom"></button>


<button id="joinRoom"></button>


<button id="publicRoom"></button>


<button id="settings"></button>


</div>


</div>



<script src="language.js"></script>


<script type="module">

import { db } from "./firebase.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



// اللغة

let language = localStorage.getItem("language") || "ar";

let text = translations[language];


document.getElementById("status").textContent =
text.online;


document.getElementById("createRoom").textContent =
text.create;


document.getElementById("joinRoom").textContent =
text.join;


document.getElementById("publicRoom").textContent =
text.rooms;


document.getElementById("settings").textContent =
text.settings;



// جلب بيانات المستخدم

let uid = localStorage.getItem("userId");


if(uid){


let userRef = doc(db,"users",uid);


let userSnap = await getDoc(userRef);



if(userSnap.exists()){


let user = userSnap.data();



document.getElementById("title").textContent =
user.name;


document.getElementById("userPhoto").src =
user.photo;


document.getElementById("userId").textContent =
"ID: " + user.id;


}


}



document.getElementById("publicRoom").onclick = function(){

window.location.href = "rooms.html";

};


</script>


</body>

</html>
