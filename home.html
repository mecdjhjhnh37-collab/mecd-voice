<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موقع المطور مجد</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="home">


<div class="profile">


<img id="userPhoto"
class="avatar"
src="default.png">


<h1 id="userName">
المستخدم
</h1>


<p id="userId">
ID: --------
</p>


<p id="status"
class="online">
🟢 متصل الآن
</p>


</div>



<div class="menu">


<button>
🎙️ إنشاء غرفة
</button>


<button>
🚪 دخول غرفة
</button>


<button>
🌍 الغرف العامة
</button>


<button>
⚙️ الإعدادات
</button>


</div>


</div>



<script type="module">


import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



onAuthStateChanged(auth,(user)=>{


if(user){


document.getElementById("userName")
.textContent =
user.displayName;


document.getElementById("userPhoto")
.src =
user.photoURL;


document.getElementById("userId")
.textContent =
"ID: " + user.uid;


}else{


window.location.href="index.html";


}


});


</script>


</body>

</html>
