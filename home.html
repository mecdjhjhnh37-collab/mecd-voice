<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="home">


<div class="profile">

<div class="avatar">
👤
</div>


<h1 id="homeTitle">
موقع المطور مجد
</h1>


<p id="status">
🟢 متصل الآن
</p>


</div>



<div class="menu">


<button id="createRoom">
🎙️ إنشاء غرفة
</button>


<button id="joinRoom">
🚪 دخول غرفة
</button>


<button id="publicRoom">
🌍 الغرف العامة
</button>


<button id="settings">
⚙️ الإعدادات
</button>


</div>


</div>



<script>

let lang = localStorage.getItem("language");


const title = document.getElementById("homeTitle");
const status = document.getElementById("status");


if(lang === "tr"){

document.documentElement.lang="tr";

title.textContent =
"Mecd Geliştirici";

status.textContent =
"🟢 Şimdi çevrimiçi";


document.getElementById("createRoom").textContent =
"🎙️ Oda oluştur";

document.getElementById("joinRoom").textContent =
"🚪 Odaya katıl";

document.getElementById("publicRoom").textContent =
"🌍 Genel odalar";

document.getElementById("settings").textContent =
"⚙️ Ayarlar";

}



document.getElementById("publicRoom").onclick = function(){

window.location.href = "rooms.html";

};


</script>


</body>

</html>
