<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice - Rooms</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="home">


<h1 id="roomsTitle"></h1>


<button id="createRoom"></button>


<button id="publicRooms"></button>



<div class="room-card">

<h2 id="room1"></h2>

<p id="people1"></p>

<button id="enter1"></button>

</div>



<div class="room-card">

<h2 id="room2"></h2>

<p id="password"></p>

<button id="enter2"></button>

</div>


</div>



<script src="language.js"></script>


<script>

let language = localStorage.getItem("language") || "ar";



if(language === "tr"){


document.getElementById("roomsTitle").textContent =
"🏠 Odalar";


document.getElementById("createRoom").textContent =
"➕ Oda oluştur";


document.getElementById("publicRooms").textContent =
"🌍 Genel odalar";


document.getElementById("room1").textContent =
"🎙️ Geliştirici odası";


document.getElementById("people1").textContent =
"👥 0 / 10";


document.getElementById("enter1").textContent =
"🚪 Katıl";


document.getElementById("room2").textContent =
"🔒 Özel oda";


document.getElementById("password").textContent =
"🔑 Şifre korumalı";


document.getElementById("enter2").textContent =
"🚪 Katıl";


}else{


document.getElementById("roomsTitle").textContent =
"🏠 الغرف";


document.getElementById("createRoom").textContent =
"➕ إنشاء غرفة";


document.getElementById("publicRooms").textContent =
"🌍 الغرف العامة";


document.getElementById("room1").textContent =
"🎙️ غرفة المطورين";


document.getElementById("people1").textContent =
"👥 0 / 10";


document.getElementById("enter1").textContent =
"🚪 دخول";


document.getElementById("room2").textContent =
"🔒 غرفة خاصة";


document.getElementById("password").textContent =
"🔑 محمية بكلمة مرور";


document.getElementById("enter2").textContent =
"🚪 دخول";


}

</script>


</body>

</html>
