<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع المطور مجد</title>
<link rel="stylesheet" href="style.css">
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1e3c72);
      background-size:400% 400%;
      animation:bg 10s ease infinite;
      color:white;
      text-align:center;
    }

    @keyframes bg{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .box{
      background:rgba(0,0,0,.35);
      padding:30px;
      border-radius:20px;
      width:90%;
      max-width:420px;
      backdrop-filter:blur(10px);
    }

    h1{
      margin-bottom:10px;
    }

    p{
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:none;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
    }

    .lang{
      background:#2563eb;
      color:white;
    }

    .google{
      background:white;
      color:black;
    }
  </style>
</head>

<body>

<div class="box">

<h1>🎙️ موقع المطور مجد</h1>

<p id="text">
مرحبًا بك في موقع المطور مجد
</p>

<button class="lang" onclick="changeLang()">
🌍 العربية / Türkçe
</button>

<button class="google">
🔐 تسجيل الدخول باستخدام Google
</button>

</div>

<script>

let ar=true;

function changeLang(){

if(ar){

document.documentElement.lang="tr";

document.querySelector("h1").innerHTML="🎙️ Mecd Geliştirici";

document.getElementById("text").innerHTML="Mecd Geliştirici'nin sitesine hoş geldiniz";

document.querySelector(".google").innerHTML="Google ile giriş yap";

}else{

document.documentElement.lang="ar";

document.querySelector("h1").innerHTML="🎙️ موقع المطور مجد";

document.getElementById("text").innerHTML="مرحبًا بك في موقع المطور مجد";

document.querySelector(".google").innerHTML="🔐 تسجيل الدخول باستخدام Google";

}

ar=!ar;

}

</script>

</body>
</html>
