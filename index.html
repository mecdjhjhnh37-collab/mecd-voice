<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موقع المطور مجد</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(45deg,#0f2027,#2c5364);
  color:white;
  font-family:Arial;
  text-align:center;
}

.box{
  background:#0005;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}

.lang{
  background:#2563eb;
  color:white;
}

.google{
  background:white;
  color:black;
}
</style>

</head>

<body>

<div class="box">

<h1 id="title">
🎙️ موقع المطور مجد
</h1>

<p id="welcome">
مرحبًا بك في موقع المطور مجد
</p>

<button class="lang" onclick="changeLang()">
🌍 العربية / Türkçe
</button>

<button id="googleLogin" class="google">
🔐 تسجيل الدخول باستخدام Google
</button>

</div>

<script src="app.js"></script>

</body>
</html>
